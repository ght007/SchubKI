about: Final evaluation scenarios H01-H06, exact text from customer_scenarios_for_final_evaluation.txt. Outputs
  must be generated by the assistant without editing.
cases:
- id: H01
  title: A new formulation after an existing NIR pilot
  enquiry: Our existing NIR pilot follows API concentration in one powder formulation at the tablet press feed frame.
    We are introducing a different API and excipient blend and would like to reuse the calibration. A colleague
    suggests adding Raman so that the old calibration will remain valid. What should our first technical assessment
    and experiment be?
- id: H02
  title: Composition monitoring across two dairy streams
  enquiry: Our dairy process handles both a relatively clear whey stream and an opaque milk concentrate. We want
    a pilot for composition monitoring, using laboratory protein and fat results where those variables are relevant.
    We can compare different measurement interfaces before choosing the installation. What first measurement concepts
    and comparison experiment would make sense for these two streams?
- id: H03
  title: A fluorescence instrument requested for glucose and viable biomass
  enquiry: We already have a fluorescence spectrometer and would like to use it to report glucose concentration
    and viable biomass directly during fermentation. Our only justification is that fluorescence can be very sensitive.
    We have not identified a fluorescent target, marker or reference relationship. What should the assistant tell
    us?
- id: H04
  title: Reuse of a silica link for petroleum MIR ATR
  enquiry: We want to investigate water content in a petroleum line using MIR ATR. The analyzer would be in another
    building. We already have a silica fiber cable from a visible or NIR measurement setup and would like to reuse
    it. The link length, routing and operating conditions have not yet been supplied. Can the assistant approve
    this concept?
- id: H05
  title: An undefined off specification liquid
  enquiry: We have a liquid process that occasionally goes off specification. We suspect contamination, but we cannot
    yet name the contaminant or the affected quality variable. We would like you to recommend the best spectroscopy
    method and exact sensor configuration immediately. What information and first experiment should come before
    that decision?
- id: H06
  title: A research sensor requested for immediate surgical use
  enquiry: We read the supplied LED NIR kidney study and want to use the same concept to guide tumor boundary decisions
    during live surgery. Can we quote its findings as proof that the proposed sensor is ready for that use? We have
    no new in vivo data and no validation on our own setup. What assessment and next feasibility steps are appropriate?
