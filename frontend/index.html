<!doctype html>
<!-- Single page: header, navigable pipeline, stage views, evidence drawer. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AFS Fiberwise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="app-header">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="spec" x1="0" x2="1"><stop offset="0" stop-color="#6d28d9"/><stop offset=".3" stop-color="#2563eb"/><stop offset=".55" stop-color="#16a34a"/><stop offset=".75" stop-color="#eab308"/><stop offset="1" stop-color="#dc2626"/></linearGradient></defs>
        <path d="M3 30 C 14 30, 14 10, 25 10 S 34 18, 37 18" fill="none" stroke="url(#spec)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="3" cy="30" r="3" fill="var(--ink)"/>
      </svg>
      <div>
        <div class="brand-name">AFS Fiberwise</div>
        <div class="brand-sub">First technical assessment for in-line spectroscopy enquiries</div>
      </div>
    </div>
    <div class="topbar-right">
      <div id="status" class="status" aria-live="polite"></div>
      <div id="account-actions" class="account-actions" aria-label="Account and subscription"></div>
    </div>
  </header>

  <div class="pipeline-navigation">
    <button type="button" class="pipeline-direction pipeline-back" id="nav-back" aria-label="Back. Already on Customer Enquiry" title="Already on Customer Enquiry" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h15"/></svg>
      <span>Back</span>
    </button>
    <nav id="fiber" class="fiber" role="tablist" aria-label="Pipeline steps"></nav>
    <button type="button" class="pipeline-direction pipeline-forward" id="nav-forward" aria-label="Forward. Available after assessment" title="Available after assessment" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m12 5 7 7-7 7M19 12H4"/></svg>
      <span>Forward</span>
    </button>
    <button type="button" class="pipeline-direction pipeline-stop" id="run-stop" aria-label="Stop assessment" title="Stop assessment" hidden>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      <span>Stop</span>
    </button>
  </div>
  </div>

  <main class="shell">
    <aside class="drawer" id="drawer" aria-label="Source viewer" hidden></aside>
    <div id="evidence-divider" class="evidence-divider" role="separator" tabindex="0" aria-label="Resize evidence viewer" aria-orientation="vertical" aria-controls="drawer" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50" title="Drag to resize. Use arrow keys to adjust; double-click or press Enter to reset to 50/50." hidden></div>
    <section class="center" id="assessment-pane">
      <div id="view" class="view" role="tabpanel"></div>
    </section>

  </main>

  <dialog id="reading-review" class="reading-review-dialog confirm" aria-labelledby="reading-confirm-title" aria-describedby="reading-confirm-description"></dialog>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
